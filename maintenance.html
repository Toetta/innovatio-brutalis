<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tillfällig paus | Innovatio Brutalis</title>
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#191717">
  <style>
    :root {
      color-scheme: dark;
      --bg: #191717;
      --bg2: #141212;
      --card: #211F1F;
      --card2: #282626;
      --line: rgba(214,164,106,.18);
      --text: #e5e7eb;
      --muted: rgba(229,231,235,.74);
      --brass: #D6A46A;
      --brass-dark: #B87333;
    }

    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(120% 140% at 0% 0%, rgba(184,115,51,.10), transparent 56%),
        linear-gradient(180deg, var(--bg), var(--bg2));
      color: var(--text);
      font: 16px/1.6 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }

    main {
      width: min(760px, 100%);
      padding: 34px 30px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background:
        linear-gradient(180deg, rgba(40,38,38,.98), rgba(33,31,31,.94));
      box-shadow: 0 18px 50px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.02);
    }

    .eyebrow {
      margin: 0 0 16px;
      color: var(--brass);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(34px, 6vw, 54px);
      line-height: 1.02;
      font-weight: 800;
    }

    p {
      margin: 0 0 14px;
      color: var(--muted);
      max-width: 58ch;
    }

    .panel {
      margin-top: 24px;
      padding: 18px 18px 16px;
      border-radius: 18px;
      border: 1px solid rgba(214,164,106,.14);
      background: rgba(25,23,23,.44);
    }

    .panel strong {
      display: block;
      margin-bottom: 6px;
      color: var(--text);
      font-size: 14px;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    a {
      color: var(--brass);
      text-decoration: none;
    }

    a:hover {
      color: var(--brass-dark);
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Tillfällig paus</p>
    <h1>Sidan är tillfälligt pausad</h1>
    <p>
      Innovatio Brutalis är tillfälligt nedtonad medan uppdateringar och genomgångar pågår.
      Innehållet kommer tillbaka när arbetet är klart.
    </p>
    <div class="panel">
      <strong>Kontakt</strong>
      <p>Vid brådskande frågor: <a href="mailto:m.arlemark@innovatio-brutalis.se">m.arlemark@innovatio-brutalis.se</a></p>
    </div>
  </main>
</body>
</html>
